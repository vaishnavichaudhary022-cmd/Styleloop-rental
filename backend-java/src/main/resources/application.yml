server:
  port: 8080

spring:
  application:
    name: revogue-rental-backend
  datasource:
    url: jdbc:h2:mem:revoguedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

revogue:
  delivery:
    city: Nashik
    default-state: Maharashtra
    pincode-prefix: "422"
    operating-radius-km: 25
