<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0812"/>
      <stop offset="50%" stop-color="#4A0E1E"/>
      <stop offset="100%" stop-color="#1A040A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <circle cx="300" cy="360" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <!-- Elegant Garment Silhouette / Hanger -->
  <g transform="translate(300, 320)" stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook -->
    <path d="M 0 -70 C 15 -70, 25 -55, 10 -40 L 0 -30 L 0 -15" stroke-width="3"/>
    <!-- Hanger Body -->
    <path d="M -90 10 L 0 -15 L 90 10 L -90 10" stroke-width="3" fill="#F59E0B" fill-opacity="0.1"/>
    <!-- Dress silhouette -->
    <path d="M -35 15 C -25 50, -40 90, -75 160 C -20 170, 20 170, 75 160 C 40 90, 25 50, 35 15 Z" stroke-width="2.5" fill="#F59E0B" fill-opacity="0.15"/>
    <!-- Waist belt / detailing -->
    <path d="M -30 65 Q 0 72 30 65" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M -50 115 Q 0 125 50 115" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <text x="300" y="525" text-anchor="middle" fill="#FDE68A" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" letter-spacing="4">REVOGUE</text>
  <text x="300" y="555" text-anchor="middle" fill="#E5E7EB" font-family="sans-serif" font-size="12" font-weight="500" letter-spacing="2" opacity="0.8">DESIGNER RENTAL CATALOG</text>
  <text x="300" y="580" text-anchor="middle" fill="#FCA5A5" font-family="sans-serif" font-size="11" opacity="0.7">Garment Preview Loading · Nashik</text>
</svg>
